<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIE A-Level Math 9709 Flashcards</title>
    <!-- 稳定版 MathJax 配置（关键修复） -->
    <script>
        MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            startup: { typeset: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .module-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tab {
            padding: 8px 16px;
            background: #e2e8f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .tab.active {
            background: #4299e1;
            color: white;
        }

        .flashcard {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            border: 3px solid #dbeafe;
        }

        .flashcard::before {
            content: "MIRROR EDUCATION    MIRROR EDUCATION    MIRROR EDUCATION";
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #60a5fa;
            letter-spacing: 1px;
            white-space: nowrap;
            z-index: 10;
        }
        .flashcard::after {
            content: "MIRROR EDUCATION    MIRROR EDUCATION    MIRROR EDUCATION";
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #60a5fa;
            letter-spacing: 1px;
            white-space: nowrap;
            z-index: 10;
        }

        .flashcard:hover {
            transform: translateY(-3px);
        }

        .card-content {
            text-align: center;
            width: 100%;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .answer {
            font-size: 18px;
            color: #4a5568;
            line-height: 1.6;
            display: none;
        }

        .answer.show {
            display: block;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4299e1;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: #3182ce;
        }

        .card-counter {
            text-align: center;
            margin-top: 15px;
            color: #718096;
            font-size: 14px;
        }

        .tip {
            text-align: center;
            margin-top: 10px;
            color: #718096;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CAIE A-Level Mathematics 9709 Flashcards</h1>
            <p>Tap card to show/hide answer | Switch modules below</p>
        </div>

        <div class="module-tabs" id="tabs"></div>

        <div class="flashcard" id="flashcard">
            <div class="card-content">
                <div class="question" id="question"></div>
                <div class="answer" id="answer"></div>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn">Previous</button>
            <button class="nav-btn" id="nextBtn">Next</button>
        </div>

        <div class="card-counter" id="counter"></div>
        <div class="tip">💡 Designed for 2026-2027 syllabus | All topics covered</div>
    </div>

    <script>
        // ====================== FLASHCARD DATA ======================
        const modules = {
            "P1": [
                { q: "How to complete the square for \(ax^2+bx+c\)?", a: "\(a\\left(x+\\frac{b}{2a}\\right)^2 + \\left(c-\\frac{b^2}{4a}\\right)\)" },
                { q: "Discriminant of \(ax^2+bx+c=0\) & meaning?", a: "\(\\Delta = b^2-4ac\)<br>>0: 2 real roots<br>=0: repeated root<br><0: no real roots" },
                { q: "What is a one-one function?", a: "Each output maps to exactly one input (passes horizontal line test); only these have inverses." },
                { q: "Four graph transformations of \(y=f(x)\)", a: "1. \(f(x)+a\): vertical shift<br>2. \(f(x+a)\): horizontal shift<br>3. \(af(x)\): vertical stretch<br>4. \(f(ax)\): horizontal stretch" },
                { q: "Circle equation: centre \((a,b)\), radius \(r\)", a: "Standard: \((x-a)^2+(y-b)^2=r^2\)<br>General: \(x^2+y^2+2gx+2fy+c=0\)" },
                { q: "Radian & sector formulae", a: "\(180^\\circ=\\pi\) rad<br>Arc length: \(s=r\\theta\)<br>Sector area: \(A=\\frac12r^2\\theta\)" },
                { q: "Basic trigonometric identities", a: "\(\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}\)<br>\(\\sin^2\\theta+\\cos^2\\theta\\equiv1\)" },
                { q: "Exact trig values for 30°,45°,60°", a: "30°: sin=1/2, cos=√3/2, tan=1/√3<br>45°: sin=cos=1/√2, tan=1<br>60°: sin=√3/2, cos=1/2, tan=√3" },
                { q: "Arithmetic progression (AP) formulae", a: "nth term: \(u_n=a+(n-1)d\)<br>Sum: \(S_n=\\frac{n}{2}[2a+(n-1)d]\)" },
                { q: "Geometric progression sum to infinity", a: "Converges if \(|r|<1\)<br>\(S_\\infty=\\frac{a}{1-r}\)" },
                { q: "Derivative of \(x^n\) & chain rule", a: "\(\\frac{d}{dx}(x^n)=nx^{n-1}\)<br>Chain rule: \(\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx}\)" },
                { q: "Nature of stationary points", a: "\(f''(x)>0\) = minimum<br>\(f''(x)<0\) = maximum<br>\(f''(x)=0\) = point of inflection" },
                { q: "Integration of \((ax+b)^n\)", a: "\(\\int(ax+b)^n dx=\\frac{(ax+b)^{n+1}}{a(n+1)}+C\)" }
            ],
            "P2": [
                { q: "Solve \(a^{kx+b}=c\)", a: "Take logs: \((kx+b)\\ln a=\\ln c\), solve for x" },
                { q: "Reciprocal trig functions", a: "\(\\sec\\theta=1/\\cos\\theta\)<br>\(\\cosec\\theta=1/\\sin\\theta\)<br>\(\\cot\\theta=1/\\tan\\theta\)" },
                { q: "Sec² & cosec² identities", a: "\(\\sec^2\\theta=1+\\tan^2\\theta\)<br>\(\\cosec^2\\theta=1+\\cot^2\\theta\)" },
                { q: "Addition formulae: sin(A±B), cos(A±B)", a: "\(\\sin(A\\pm B)=\\sin A\\cos B\\pm\\cos A\\sin B\)<br>\(\\cos(A\\pm B)=\\cos A\\cos B\\mp\\sin A\\sin B\)" },
                { q: "Express \(a\\sin\\theta+b\\cos\\theta\) as \(R\\sin(\\theta+\\alpha)\)", a: "\(R=\\sqrt{a^2+b^2}\), \(\\tan\\alpha=b/a\)" },
                { q: "Product & quotient rule", a: "Product: \((uv)'=u'v+uv'<br>Quotient: (u/v)'=(u'v-uv')/v^2\)" },
                { q: "Derivatives of \(e^x, \ln x, \sin(ax+b)\)", a: "\((e^x)'=e^x\), \((\\ln x)'=1/x\), \((\\sin(ax+b))'=a\\cos(ax+b)\)" },
                { q: "Trapezium rule", a: "\(\\int_a^b f(x)dx\\approx\\frac{h}{2}[y_0+2(y_1+...+y_{n-1})+y_n]\)" },
                { q: "Root location in interval [a,b]", a: "If \(f(a)\) and \(f(b)\) have opposite signs, a root exists between them" },
                { q: "Iterative formula", a: "Rearrange to \(x=F(x)\), then \(x_{n+1}=F(x_n)\)" }
            ],
            "P3": [
                { q: "Solve \(|ax+b|=|cx+d|\)", a: "Square both sides: \((ax+b)^2=(cx+d)^2\)" },
                { q: "Factor & Remainder Theorem", a: "Factor: \(P(k)=0\\Rightarrow(x-k)\) is factor<br>Remainder: remainder = \(P(k)\)" },
                { q: "Binomial expansion \((1+x)^n\) (|x|<1)", a: "\(1+nx+\\frac{n(n-1)}{2!}x^2+...\)" },
                { q: "Parametric differentiation", a: "\(\\frac{dy}{dx}=\\frac{dy/dt}{dx/dt}\)" },
                { q: "Integration by parts", a: "\(\\int u\\,dv=uv-\\int v\\,du\)" },
                { q: "Integrate \(f'(x)/f(x)\)", a: "\(\\ln|f(x)|+C\)" },
                { q: "Vector line equation", a: "\(\\mathbf{r}=\\mathbf{a}+t\\mathbf{b}\)" },
                { q: "Scalar product & angle", a: "\(\\mathbf{a}\\cdot\\mathbf{b}=|\\mathbf{a}||\\mathbf{b}|\\cos\\theta\)" },
                { q: "Solve separable DE \(dy/dx=f(x)g(y)\)", a: "Separate: \(\\int 1/g(y) dy=\\int f(x) dx\)" },
                { q: "Modulus & argument of \(z=x+iy\)", a: "\(|z|=\\sqrt{x^2+y^2}\\), \(\\arg z=\\tan^{-1}(y/x)\)" }
            ],
            "M1": [
                { q: "Equilibrium condition", a: "Vector sum of all forces = 0" },
                { q: "Friction formula", a: "\(F\\leq\\mu R\); limiting friction: \(F=\\mu R\)" },
                { q: "SUVAT equations", a: "\(v=u+at\)<br>\(s=ut+1/2at^2\)<br>\(v^2=u^2+2as\)" },
                { q: "Conservation of momentum", a: "Total momentum before = total momentum after (no external forces)" },
                { q: "Newton's Second Law", a: "\(F=ma\)" },
                { q: "Work done by force", a: "\(W=Fd\\cos\\theta\)" },
                { q: "KE & GPE", a: "\(KE=1/2mv^2\), \(GPE=mgh\)" },
                { q: "Power", a: "\(P=Fv\)" }
            ],
            "S1": [
                { q: "Mean & standard deviation (grouped)", a: "\(\\bar x=\\sum xf/\\sum f\)<br>\(\\sigma=\\sqrt{\\sum x^2f/\\sum f - (\\bar x)^2}\)" },
                { q: "Permutation & Combination", a: "\(^nP_r=n!/(n-r)!\)<br>\(^nC_r=n!/(r!(n-r)!)\)" },
                { q: "Conditional probability", a: "\(P(A|B)=P(A\\cap B)/P(B)\)" },
                { q: "Binomial distribution mean & variance", a: "\(E(X)=np\), \(Var(X)=np(1-p)\)" },
                { q: "Standardize normal distribution", a: "\(Z=(X-\\mu)/\\sigma\)" }
            ],
            "S2": [
                { q: "Poisson distribution formula", a: "\(P(X=r)=\\frac{e^{-\\lambda}\\lambda^r}{r!}\), \(E(X)=Var(X)=\\lambda\)" },
                { q: "Central Limit Theorem", a: "For large n, sample mean \(\(\\bar X\\sim N(\\mu,\\sigma^2/n)\)" },
                { q: "Unbiased population variance", a: "\(s^2=\\frac{1}{n-1}\\left(\\sum x^2-\\frac{(\\sum x)^2}{n}\\right)\)" },
                { q: "Type I & Type II error", a: "Type I: reject \(H_0\) when true<br>Type II: accept \(H_0\) when false" }
            ]
        };

        // ====================== CORE LOGIC ======================
        let currentModule = "P1";
        let currentIndex = 0;
        let cardList = modules[currentModule];

        // DOM 元素
        const tabsContainer = document.getElementById("tabs");
        const questionEl = document.getElementById("question");
        const answerEl = document.getElementById("answer");
        const counterEl = document.getElementById("counter");
        const card = document.getElementById("flashcard");

        // 渲染标签
        function renderTabs() {
            tabsContainer.innerHTML = '';
            Object.keys(modules).forEach(mod => {
                const tab = document.createElement("button");
                tab.className = "tab";
                if (mod === currentModule) tab.classList.add("active");
                tab.textContent = mod;
                tab.onclick = () => {
                    currentModule = mod;
                    cardList = modules[currentModule];
                    currentIndex = 0;
                    renderCard();
                };
                tabsContainer.appendChild(tab);
            });
        }

        // 安全渲染卡片 + MathJax（核心修复）
        async function renderCard() {
            const currentCard = cardList[currentIndex];
            
            // 先清空内容，避免 MathJax 残留
            questionEl.innerHTML = '';
            answerEl.innerHTML = '';
            answerEl.classList.remove("show");

            // 赋值新内容
            questionEl.innerHTML = currentCard.q;
            answerEl.innerHTML = currentCard.a;

            // 渲染计数器
            counterEl.textContent = `Card ${currentIndex+1} of ${cardList.length} | Module: ${currentModule}`;

            // 安全渲染公式
            if (window.MathJax) {
                await MathJax.typesetPromise([questionEl, answerEl]);
            }
        }

        // 点击显示/隐藏答案
        card.addEventListener("click", () => {
            answerEl.classList.toggle("show");
        });

        // 上下页导航
        document.getElementById("nextBtn").addEventListener("click", () => {
            if (currentIndex < cardList.length - 1) {
                currentIndex++;
                renderCard();
            }
        });

        document.getElementById("prevBtn").addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        });

        // 初始化
        renderTabs();
        renderCard();
    </script>
</body>
</html>
